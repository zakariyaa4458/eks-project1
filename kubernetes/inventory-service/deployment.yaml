apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-deployment
  labels:
    app: inventory-service
    environment: production

spec:
  replicas: 2
  selector: 
    matchLabels:
      app: inventory-service


  template:
    metadata:
      labels:
        app: inventory-service

    spec:
      containers:
      - name: inventory-service
        image: inventory-service:latest
        ports:
        - containerPort: 8082

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"


        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
        
          initialDelaySeconds: 3
          periodSeconds: 3

        readinessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 10