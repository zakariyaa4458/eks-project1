apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-sqs-scaler
  namespace: application-namespace
  annotations:
   
spec:
  scaleTargetRef:
    name: worker-deployment
  pollingInterval:  30                                      # Optional. Default: 30 seconds
  cooldownPeriod:   300                                     # Optional. Default: 300 seconds
 
  minReplicaCount:  0                                   # change back to 1 nvjbrgrd
  maxReplicaCount:  10                                    # Optional. Default: 100

  triggers:
    - type: aws-sqs-queue

      metadata:
        queueURL: https://sqs.eu-west-2.amazonaws.com/499024813019/eks_sqs
        awsRegion: eu-west-2
        queueLength: "5"

      authenticationRef:
        name: keda-sqs-auth