apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service-deployment
  labels:
    app: shipping-service
    environment: production
  namespace: application-namespace
  annotations:
    checkov.io/skip1: CKV_K8S_43=I will add commits when I have the apply the aws infrastructure


spec:
  replicas: 2
  selector: 
    matchLabels: 
      app: shipping-service


  template:
    metadata:
      labels:
        app: shipping-service

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 30000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: shipping-service-service-account
      containers:
      - name: shipping-service
        image: shipping-service:latest
        securityContext:
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        ports:
        - containerPort: 8085

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"


        livenessProbe:
          httpGet:
            path: /healthz
            port: 8085
        
          initialDelaySeconds: 3
          periodSeconds: 3

        readinessProbe:
          tcpSocket:
            port: 8085
          initialDelaySeconds: 15
          periodSeconds: 10