apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service-deployment
  labels:
    app: shipping-service
    environment: production

spec:
  replicas: 2
  selector: 
    matchLabels: 
      app: shipping-service


  template:
    metadata:
      labels:
        app: shipping-service

    spec:
      containers:
      - name: shipping-service
        image: shipping-service:latest
        ports:
        - containerPort: 8085

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"


        livenessProbe:
          httpGet:
            path: /healthz
            port: 8085
        
          initialDelaySeconds: 3
          periodSeconds: 3

        readinessProbe:
          tcpSocket:
            port: 8085
          initialDelaySeconds: 15
          periodSeconds: 10