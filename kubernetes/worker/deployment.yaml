apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  labels:
    app: worker
    environment: production

spec:
  replicas: 2
  selector:
    matchLabels: 
      app: worker


  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
      - name: worker
        image: worker:latest
        ports:
        - containerPort: 8090

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8090
          failureThreshold: 3
          periodSeconds: 10

        readinessProbe: 
          tcpSocket:
            port: 8090
          initialDelaySeconds: 15
          periodSeconds: 10
