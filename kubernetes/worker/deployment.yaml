apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: application-namespace
  
  labels:
    app: worker
    environment: production
  annotations:
    checkov.io/skip1: CKV_K8S_43=I will add commits when I apply the aws infrastructure
    checkov.io/skip2: CKV_K8S_14=I will add commits when I apply the aws infrastructure

spec:
  replicas: 2
  selector:
    matchLabels: 
      app: worker


  template:
    metadata:
      labels:
        app: worker

    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 30000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: worker-service-account
      containers:
      - name: worker
        image: worker:latest
        securityContext:
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        ports:
        - containerPort: 8090

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8090
          failureThreshold: 3
          periodSeconds: 10

        readinessProbe: 
          tcpSocket:
            port: 8090
          initialDelaySeconds: 15
          periodSeconds: 10
