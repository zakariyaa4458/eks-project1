apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-deployment
  labels:
    app: order-service
    environment: production

spec:
  replicas: 2
  selector: 
    matchLabels:
      app: order-service


  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service
        image: order-service:latest
        ports:
        - containerPort: 8081

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
      
          initialDelaySeconds: 3
          periodSeconds: 3

        readinessProbe:
          tcpSocket:
            port: 8081

          initialDelaySeconds: 15
          periodSeconds: 10