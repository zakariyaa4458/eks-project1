apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api-deployment
  labels:
    app: dashboard-api
    environment: production
  namespace: application-namespace
  annotations:
    checkov.io/skip1: CKV_K8S_43=I will add commits when I apply the aws infrastructure
    checkov.io/skip2: CKV_K8S_14=I will add commits when I apply the aws infrastructure

spec:
  replicas: 2
  selector: 
    matchLabels:
      app: dashboard-api 


  template:
    metadata:
      labels:
        app: dashboard-api

    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 30000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: dashboard-api-service-account
      containers:
      - name: dashboard-api
        image: dashboard:latest
        securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 30000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        ports:
        - containerPort: 8086

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8086
          initialDelaySeconds: 3
          periodSeconds: 3

        readinessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 15
          periodSeconds: 10