apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api-deployment
  labels:
    app: dashboard-api
    environment: production

spec:
  replicas: 2
  selector: 
    matchLabels:
      app: dashboard-api 


  template:
    metadata:
      labels:
        app: dashboard-api

    spec:
      containers:
      - name: dashboard-api
        image: dashboard:latest
        ports:
        - containerPort: 8086

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8086
          initialDelaySeconds: 3
          periodSeconds: 3

        readinessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 15
          periodSeconds: 10