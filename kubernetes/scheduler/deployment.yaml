apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-deployment
  labels:
    app: scheduler
    environment: production
  namespace: application-namespace
  annotations:
    checkov.io/skip1: CKV_K8S_43=I will add commits when I apply the aws infrastructure
    checkov.io/skip2: CKV_K8S_14=I will add commits when I apply the aws infrastructure
spec:
  replicas: 2
  selector: 
    matchLabels: 
      app: scheduler
    


  template:
    metadata:
      labels:
        app: scheduler

    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 30000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: scheduler
        image: scheduler:latest
        securityContext:
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        ports:
        - containerPort: 8091

        resources:
          requests:
            memory: "115Mi"
            cpu: "100m"
          limits:
            memory: "200Mi"
            cpu: "250m"

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8091
        
          initialDelaySeconds: 3
          periodSeconds: 3

        readinessProbe:
          tcpSocket:
            port: 8091
          initialDelaySeconds: 15
          periodSeconds: 10