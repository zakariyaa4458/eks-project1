apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-deployment
  labels:
    app: scheduler
    environment: production

spec:
  replicas: 2
  selector: 
    matchLabels: 
      app: scheduler
    


  template:
    metadata:
      labels:
        app: scheduler

    spec:
      containers:
      - name: scheduler
        image: scheduler:latest
        ports:
        - containerPort: 8091

        resources:
          requests:
            memory: "115Mi"
            cpu: "100m"
          limits:
            memory: "200Mi"
            cpu: "250m"

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8091
        
          initialDelaySeconds: 3
          periodSeconds: 3

        readinessProbe:
          tcpSocket:
            port: 8091
          initialDelaySeconds: 15
          periodSeconds: 10