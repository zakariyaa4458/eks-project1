apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argo-cd

spec:
  project: default

  source:
    repoURL: https://github.com/zakariyaa4458/eks-project1
    targetRevision: main
    path: kubernetes/infrastructure

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true