apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application
  namespace: argo-cd

spec:
  project: default

  source:
    repoURL: https://github.com/zakariyaa4458/eks-project1
    targetRevision: main
    path: kubernetes/application

  destination:
    server: https://kubernetes.default.svc
    namespace: application-namespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true